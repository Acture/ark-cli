[package]
name = "ark-battle-runtime"
version = "0.0.2"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Acture/ark-cli"
readme = "README.md"
include = ["Cargo.toml", "build.rs", "README.md", "src/**", "unity/**", "examples/**", "licenses/**"]
description = "Execute MAA jobs with the original battle implementation in an owned Unity Player."

[dependencies]
ark-unity = { version = "0.0.2", path = "../ark_unity" }
ark-battle-runtime-probe = { version = "0.0.2", path = "../battle_runtime_probe" }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
regex = "1"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# Embed third-party tools and the prebuilt probe (release builds; see RELEASE.md).
bundled-tools = []
